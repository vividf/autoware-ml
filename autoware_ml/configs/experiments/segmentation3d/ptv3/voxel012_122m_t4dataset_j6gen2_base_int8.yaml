# @package _global_
# INT8 (Q/DQ explicit quantization) variant of the j6gen2 PTv3 segmentation experiment.
#
# Produce the quantized checkpoint, then deploy it (export + evaluate). The checkpoint
# describes its own quantization, so deploy/test read no quantization config:
#
#   autoware-ml quantize \
#     --config-name experiments/segmentation3d/ptv3/voxel012_122m_t4dataset_j6gen2_base_int8 \
#     --weights <FP best.ckpt>
#   autoware-ml deploy \
#     --config-name experiments/segmentation3d/ptv3/voxel012_122m_t4dataset_j6gen2_base_int8 \
#     --weights <ptq.ckpt produced by the quantize run>
#
# Engines build strongly typed: INT8 comes from the Q/DQ nodes baked into the exported
# ONNX. Both PTv3 graphs carry runtime plugin ops, so the non-quantized parts get the
# whole-graph FP16 cast rather than AutoCast (deploy.onnx.precision: fp16 from base).
defaults:
  - voxel012_122m_t4dataset_j6gen2_base
  - _self_

experiment_name: voxel012_122m_t4dataset_int8

deploy:
  tensorrt:
    enabled: true
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  fuse_bn: true
  default_precision: int8
  # SmoothQuant (Xiao et al. 2022, via modelopt): max calibration, then every INT8 Linear
  # migrates its activation outliers into its weight (per-input-channel pre_quant_scale).
  # PTv3 is 74 Linears, and plain histogram+MSE calibration loses 6.4 mIoU here; measured
  # 2026-09-04 on 300 val frames (TRT): mse 0.7150 / entropy 0.7228 / smoothquant 0.7787
  # (alpha 0.5) / 0.7793 (alpha 0.8) vs FP16 0.7792 — INT8 PTQ in the FP16 band, no QAT
  # needed, latency unchanged (6.93 vs 6.91 ms). The QAT variant inherits this calibration.
  calibration:
    method: smoothquant
    smoothquant_alpha: 0.5
  # 400 samples @ batch_size=1, seed 0 (same calibration set as the other INT8 recipes).
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
