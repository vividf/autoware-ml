# @package _global_
defaults:
  - base
  - /database@database: t4dataset/t4dataset_j6gen2_semaseg_base
  - /datamodule@datamodule: t4dataset/default_segmentation3d_datamodule
  - /metrics/t4dataset@metric_ranges: default_120m_metric_ranges
  - _self_

batch_size: 16
num_workers: 8

experiment_group_name: ptv3/${database.version}/j6gen2_base
experiment_name: voxel012_122m_t4dataset
point_cloud_range: [-122.88, -122.88, -3.0, 122.88, 122.88, 5.0]
grid_size: 0.12

trainer:
  max_epochs: 50
  check_val_every_n_epoch: 1

optimizer:
  lr: 0.002
  weight_decay: 0.005

model:
  optimizer_group_overrides:
    block:
      lr: 0.0002
  scheduler:
    # One entry per optimizer group, in build_optimizer_groups() order (default, block).
    max_lr: [0.002, 0.0002]

deploy:
  # TensorRT optimization profiles. Every PTv3 graph input is indexed by a point count
  # that varies per frame, so these are a measured property of the data at this grid
  # size, not a number anyone can write down: min/opt/max come from running the torch
  # stage pipeline over 30 test frames (`# measured` records the observed range) with
  # 0.5x / 1.5x headroom, because an engine must accept a frame denser than any seen.
  stages:
    encoder:
      tensorrt:
        input_shapes:
          grid_coord:
            min_shape: [63026, 3]
            opt_shape: [130565, 3]
            max_shape: [202619, 3]
            # measured [126052, 3] .. [135079, 3]
          feat:
            min_shape: [63026, 4]
            opt_shape: [130565, 4]
            max_shape: [202619, 4]
            # measured [126052, 4] .. [135079, 4]
          serialized_code:
            min_shape: [2, 63026]
            opt_shape: [2, 130565]
            max_shape: [2, 202619]
            # measured [2, 126052] .. [2, 135079]
          serialized_pooling_0_indices:
            min_shape: [63026]
            opt_shape: [130565]
            max_shape: [202619]
            # measured [126052] .. [135079]
          serialized_pooling_0_indptr:
            min_shape: [30005]
            opt_shape: [63296]
            max_shape: [99874]
            # measured [60011] .. [66582]
          serialized_pooling_0_head_indices:
            min_shape: [30005]
            opt_shape: [63295]
            max_shape: [99872]
            # measured [60010] .. [66581]
          serialized_pooling_0_grid_coord:
            min_shape: [30005, 3]
            opt_shape: [63295, 3]
            max_shape: [99872, 3]
            # measured [60010, 3] .. [66581, 3]
          serialized_pooling_0_serialized_order:
            min_shape: [2, 30005]
            opt_shape: [2, 63295]
            max_shape: [2, 99872]
            # measured [2, 60010] .. [2, 66581]
