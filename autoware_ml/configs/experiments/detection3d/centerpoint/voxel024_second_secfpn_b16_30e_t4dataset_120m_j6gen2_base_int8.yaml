# @package _global_
# INT8 (Q/DQ explicit quantization) variant of the j6gen2_base CenterPoint experiment.
#
# Produce the quantized checkpoint, then deploy it (export + verify + evaluate). The
# checkpoint describes its own quantization, so deploy/test read no quantization config:
#
#   autoware-ml quantize \
#     --config-name experiments/detection3d/centerpoint/voxel024_second_secfpn_b16_30e_t4dataset_120m_j6gen2_base_int8 \
#     --weights <FP best.ckpt>
#   autoware-ml deploy \
#     --config-name experiments/detection3d/centerpoint/voxel024_second_secfpn_b16_30e_t4dataset_120m_j6gen2_base_int8 \
#     --weights <ptq.ckpt produced by the quantize run>
#
# Engines build strongly typed: INT8 comes from the Q/DQ nodes baked into the
# exported ONNX (explicit quantization); the non-quantized stages inherit
# deploy.onnx.precision: fp16 from base.yaml (AutoCast).
defaults:
  - voxel024_second_secfpn_b16_30e_t4dataset_120m_j6gen2_base
  - _self_

experiment_name: voxel024_second_secfpn_b16_30e_t4dataset_120m_int8

# The INT8 release variants exist to produce deployment artifacts and numbers:
# build the engine and run verification + evaluation by default (these stay
# opt-in in base.yaml).
deploy:
  tensorrt:
    enabled: true
  verification:
    enabled: true
    # INT8 raw-logit diffs between backends are expected while metrics stay equal, so the
    # tolerances are empirically calibrated per scenario (whole-list override: Hydra lists replace).
    # pytorch-vs-onnx: fp32 fake-quant reference vs fp16(AutoCast)+QDQ ONNX — observed
    # max_diff 2.07 on vel logits with equal mAP; gate at 2.5.
    scenarios:
      - { ref: { backend: pytorch, device: cuda }, test: { backend: onnx, device: cuda }, tolerance: 2.5 }
      - { ref: { backend: onnx, device: cuda }, test: { backend: tensorrt, device: cuda }, tolerance: 8.0 }
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  fuse_bn: true
  default_precision: int8
  # The PFN stays FP16: pillar features are latency-cheap and quantizing them buys nothing.
  skip_quantize:
    - pts_voxel_encoder
  # SECOND has no residual blocks, so the "residual_add" recipe would match nothing anyway.
  disable_recipes:
    - residual_add
  # Reference recipe: 400 samples @ batch_size=1, seed 0, histogram + MSE amax.
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
