# @package _global_
# Channel-pruned variant of the j6gen2_base CenterPoint experiment (FastNAS width search on
# pts_backbone / pts_neck / bbox_head + knowledge-distillation fine-tune).
#
#   autoware-ml prune \
#     --config-name experiments/detection3d/centerpoint/voxel024_second_secfpn_b16_30e_t4dataset_120m_j6gen2_base_pruned \
#     --weights <FP best.ckpt>
#   autoware-ml deploy --config-name <this or the base config> --weights <best.ckpt produced by prune>
#
# The produced checkpoint embeds its channel table: deploy / test / quantize rebuild the
# narrowed architecture from it and read no pruning config. M1 reference (2026-09-07, 100
# frames, sm_120 / TRT 10.8): 60% FLOPs -> pts_backbone_neck_head 3.52 -> 2.8 ms on the INT8
# recipe; accuracy is what the fine-tune below is for.
defaults:
  - voxel024_second_secfpn_b16_30e_t4dataset_120m_j6gen2_base
  - _self_

experiment_name: voxel024_second_secfpn_b16_30e_t4dataset_120m_pruned

pruning:
  enabled: true
  # search = width search only (latency probe; accuracy not meaningful);
  # finetune = search + KD fine-tune (the deployable path).
  mode: finetune
  # FastNAS upper bound on the dense subtree's FLOPs (% of the original).
  flops: 60%
  # Rank candidate subnets by the deploy mAP on this many frames (~2 s / evaluation;
  # `proxy` = output distance to the un-pruned net, seconds per search, smoke only).
  score: map
  score_samples: 30
  # Frames of spatial_features cached for FastNAS' BatchNorm re-calibration.
  calib_frames: 16
  # Per-layer width candidates: fractions of the original width, rounded to the divisor
  # (32 keeps INT8 IMMA alignment).
  channels_ratio: [0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1.0]
  channel_divisor: 32
  finetune:
    # Real capacity recovery, not amax correction: more epochs and a higher peak than QAT
    # (original training: 30 epochs, peak 5e-4 = lr 1e-4 x max_lr_factor 5).
    epochs: 10
    lr: 1.0e-4
    schedule: cosine
    # Scale of the model's distillation_loss (teacher = the FP model before the search).
    kd_weight: 1.0
    val_check_interval: 0.5
