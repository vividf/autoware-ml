# @package _global_
# INT8 (Q/DQ explicit quantization) variant of the j6gen2_base BEVFusion-lidar experiment.
#
# Produce the quantized checkpoint, then deploy it (export + evaluate). The checkpoint
# describes its own quantization, so deploy/test read no quantization config:
#
#   autoware-ml quantize \
#     --config-name experiments/detection3d/bevfusion/lidar_voxel0170_second_secfpn_b16_30e_t4dataset_120m_j6gen2_base_int8 \
#     --weights <FP checkpoint>
#   autoware-ml deploy \
#     --config-name experiments/detection3d/bevfusion/lidar_voxel0170_second_secfpn_b16_30e_t4dataset_120m_j6gen2_base_int8 \
#     --weights <ptq.ckpt produced by the quantize run>
#
# Only the dense graph quantizes (backbone / neck / head Conv2d); the sparse stage's
# INT8 form is the libspconv engine from the dedicated exporter (module TODO in
# main_modules/bevfusion/stages.py). Engines build strongly typed; the non-quantized
# graph regions inherit deploy.onnx.precision: fp16 from base.yaml (AutoCast).
defaults:
  - lidar_voxel0170_second_secfpn_b16_30e_t4dataset_120m_j6gen2_base
  - _self_

experiment_name: lidar_voxel0170_second_secfpn_b16_30e_t4dataset_120m_int8

# The INT8 variants exist to produce deployment artifacts and numbers: build the
# engine and evaluate by default. Verification stays disabled — BEVFusion's packed
# outputs are proposal-selection variant (see base.yaml); mAP equality is the gate.
deploy:
  tensorrt:
    enabled: true
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  fuse_bn: true
  default_precision: int8
  # Keep the validated conv-only INT8 tree: the model rules also pin the decoder FFN
  # linears to FP8 (see the *_fp8 experiment); this recipe measures INT8 convolutions.
  skip_quantize:
    - bbox_head.decoder
  # SECOND has no residual blocks, so the "residual_add" recipe would match nothing anyway.
  disable_recipes:
    - residual_add
  # Reference recipe: 400 samples @ batch_size=1, seed 0, histogram + MSE amax.
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
