# Seven-class detection3d taxonomy of T4dataset. These are the classes of the nuScenes
# detection taxonomy, in the same order, so a detector pretrained on nuScenes keeps its
# classification layer, and the classes the deployed camera detector decodes. It folds the
# coarse taxonomy: the classes both share keep their coarse meaning, motorcycles train as
# bicycles and debris as barriers (the two-wheeler and the static obstacle group, as the
# previous seven-class mapping did), and animals are no targets.
_target_: autoware_ml.databases.taxonomy.Detection3DTaxonomy

defaults:
  - /database/t4dataset/taxonomy/vocabulary@vocabulary: default_detection3d
  - _self_

ignore_index: -1
class_groups:
  grouped_vehicle: [car, truck, bus]
  grouped_two_wheeler: [bicycle]
  grouped_living: [pedestrian]
  grouped_obstacle: [barrier, traffic_cone]
eval_range:
  car: 121.0
  truck: 121.0
  bus: 121.0
  bicycle: 121.0
  pedestrian: 121.0
  traffic_cone: 121.0
  barrier: 121.0
collision_kinds:
  car: wheeled
  truck: wheeled
  bus: wheeled
  bicycle: living
  pedestrian: living
  traffic_cone: static
  barrier: static
living_speeds:
  pedestrian: 3.0
  bicycle: 6.0
class_names:
  - car
  - truck
  - bus
  - bicycle
  - pedestrian
  - traffic_cone
  - barrier
class_mapping:
  # As in the coarse taxonomy, except motorcycle, animal, debris and pushable_pullable
  car: car
  kart: car
  other_vehicle: car
  police_car: car
  ambulance: car
  emergency_vehicle: car
  forklift: truck
  truck: truck
  fire_truck: truck
  construction_vehicle: truck
  trailer: truck
  bus: bus
  train: null
  motorcycle: bicycle
  bicycle: bicycle
  pedestrian: pedestrian
  stroller: pedestrian
  personal_mobility: pedestrian
  animal: null
  barrier: barrier
  construction_sign: barrier
  traffic_cone: traffic_cone
  debris: barrier
  pushable_pullable: barrier
  bicycle_rack: null
  other_stuff: null
  open_door: null
  vehicle_protruding_object: null
