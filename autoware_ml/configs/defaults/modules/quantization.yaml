# @package _global_

# Schema: autoware_ml/quantization/config.py. A model's `_int8` / `_fp8` variant enables it
# for `autoware-ml quantize`; deploy and test read the quantization from the checkpoint.
quantization:
  enabled: false
  mode: ptq
  default_precision: int8
  # Modules (glob patterns over named_modules) left un-quantized, whole subtree included.
  skip_quantize: []
  dry_run: false
  # Activation amax method: mse | entropy | percentile | max | smoothquant.
  calibration:
    method: mse
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
