# @package _global_

deploy:
  onnx:
    enabled: true
    dynamo: true
    opset_version: 21
    modify_graph: null
    precision: fp32
  tensorrt:
    enabled: true
    workspace_size: 4294967296
    # Custom TensorRT plugin shared libraries loaded before the ONNX is parsed
    # (graphs with autoware::* ops). Empty for plain graphs.
    plugin_libraries: []
