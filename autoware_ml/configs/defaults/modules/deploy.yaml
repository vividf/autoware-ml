# @package _global_

deploy:
  onnx:
    enabled: true
    dynamo: true
    opset_version: 21
    modify_graph: null
    precision: fp32
  tensorrt:
    enabled: true
    workspace_size: 4294967296
    # Shared libraries of custom TensorRT plugins, for graphs with autoware::* ops.
    plugin_libraries: []
  # Post-export steps, opt-in, for models that declare build_stages(): verification
  # compares the raw model outputs of two backends, evaluation scores and times every
  # backend on ground truth.
  verification:
    enabled: false
    # Absolute, for fp32 graphs; lossy backends (fp16, int8) set a per-scenario tolerance.
    tolerance: 0.01
    num_verify_batches: 1
    # - { ref: { backend: pytorch, device: cuda }, test: { backend: tensorrt, device: cuda } }
    scenarios: []
  evaluation:
    enabled: false
    # test, or val when the test split is unavailable or held back.
    split: test
    num_samples: -1
    num_warmup: 2
    # Replaces the split's training-time batch size: the deployed graphs are single-frame
    # and the latency is per batch.
    batch_size: 1
    # Cap on the torch intra-op and BLAS / OpenMP threads; 0 keeps the defaults. At 1,
    # busy-waiting OpenBLAS workers cannot inflate the TensorRT time of graphs with
    # data-dependent shapes (see EvaluationConfig.cpu_threads).
    cpu_threads: 1
    backends:
      pytorch: { enabled: true, device: cuda }
      onnx: { enabled: true, device: cuda }
      tensorrt: { enabled: true, device: cuda }
