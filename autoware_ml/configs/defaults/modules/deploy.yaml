# @package _global_

deploy:
  onnx:
    enabled: true
    dynamo: true
    opset_version: 21
    modify_graph: null
    precision: fp32
  tensorrt:
    enabled: true
    workspace_size: 4294967296
    # Shared libraries of custom TensorRT plugins, for graphs with autoware::* ops.
    plugin_libraries: []
  # Post-export steps. Both run only for models that declare a stage graph
  # (ModuleBaseModel.build_stages) and are opt-in per model config.
  # Cross-backend numerical parity of the raw model outputs (model_output_names).
  verification:
    enabled: false
    # Default absolute tolerance for FP32-graph comparisons. Lossy backends (fp16
    # engines, int8) set an explicit per-scenario `tolerance` instead of loosening this.
    tolerance: 0.01
    num_verify_batches: 1
    # - { ref: { backend: pytorch, device: cuda }, test: { backend: tensorrt, device: cuda } }
    scenarios: []
  # Per-backend ground-truth metrics + latency on the test split. PyTorch is a backend
  # like the others; keys land under {split}/{backend}/{prefix}/{metric}.
  evaluation:
    enabled: false
    # test (default) or val — for when the test split is unavailable or held back.
    split: test
    num_samples: -1
    num_warmup: 2
    # Frames per evaluated batch (the latency is per batch); the split's own dataloader
    # setting is the training-time one and the deployed graphs are single-frame.
    batch_size: 1
    # CPU worker threads (torch intra-op + BLAS / OpenMP pools) during evaluation; 0 keeps
    # the process defaults. Kept at 1 so busy-waiting OpenBLAS workers from numpy
    # preprocessing / metrics do not inflate the measured TensorRT time of graphs with
    # data-dependent shapes (see EvaluationConfig.cpu_threads).
    cpu_threads: 1
    backends:
      pytorch: { enabled: true, device: cuda }
      onnx: { enabled: true, device: cuda }
      tensorrt: { enabled: true, device: cuda }
