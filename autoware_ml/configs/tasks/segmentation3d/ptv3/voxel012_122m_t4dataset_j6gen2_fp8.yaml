# @package _global_
# FP8 (E4M3, per-tensor) variant of the j6gen2 PTv3 segmentation config.
#
#   autoware-ml quantize --config-name segmentation3d/ptv3/voxel012_122m_t4dataset_j6gen2_fp8 --weights <FP best.ckpt>
#   autoware-ml deploy   --config-name segmentation3d/ptv3/voxel012_122m_t4dataset_j6gen2_fp8 --weights <ptq.ckpt>
#
# The checkpoint describes its own quantization, so deploy / test read nothing from the
# `quantization` section. Engines build strongly typed: the quantized Linear layers come
# from the Q/DQ (or FP8 trt-domain) nodes in the exported ONNX, quantized cpe sparse
# convolutions deploy as INT8 plugin nodes carrying their scales, everything else runs
# fp16, and the graph I/O stays fp32.
defaults:
  - /tasks/segmentation3d/ptv3/voxel012_122m_t4dataset_j6gen2
  - _self_

deploy:
  onnx:
    # fp16-typed QuantizeLinear / DequantizeLinear need opset 19.
    opset_version: 19
    precision: fp16
  tensorrt:
    enabled: true
  verification:
    enabled: true
    # Quantized raw softmax diffs between the fp32 fake-quant reference and the engine are
    # larger than the fp16 gate of base.yaml while mIoU stays equal. Measured 2026-09-24
    # (INT8 linears, SmoothQuant): pytorch vs tensorrt pred_probs max_diff 0.186
    # (mean 4.5e-4, 0.34 % of the labels flipped at near-ties); gate 0.5 (whole-list
    # override: Hydra lists replace).
    scenarios:
      - { ref: { backend: pytorch, device: cuda }, test: { backend: tensorrt, device: cuda }, tolerance: 0.5 }
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  fuse_bn: true
  # FP8 for the attention / FFN linears (E4M3 holds the mIoU that INT8 linears lose);
  # the cpe sparse convolutions stay fp16 (the plugin has no FP8 path).
  default_precision: fp8
  skip_quantize:
    - "*cpe.0"
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
