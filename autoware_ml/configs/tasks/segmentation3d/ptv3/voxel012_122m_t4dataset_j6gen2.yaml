# @package _global_
defaults:
  - /tasks/segmentation3d/ptv3/tiny
  - /datasets/t4dataset/segmentation3d
  - /datasets/t4dataset/lidar
  - /database@database: t4dataset/t4dataset_j6gen2_semaseg
  - /datamodule@datamodule: t4dataset/default_segmentation3d_datamodule
  - _self_

dataset: ${t4dataset}

batch_size: 16
num_workers: 8

max_voxels: 524288
grid_size: 0.12
point_cloud_range: [-122.88, -122.88, -3.0, 122.88, 122.88, 5.0]

datamodule:
  train_dataset:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          use_dim: [0, 1, 2, 3]
          bev_remove_radius: 0.0
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all
          past:
            _target_: autoware_ml.transforms.point_cloud.loading.SweepWindow
            num: 1
            time_lag_range: [0.05, 0.25]
            selection: random
          bev_remove_radius: 1.0
          use_timestamp_difference: true
          use_dim: [0, 1, 2, 3]
        - _target_: autoware_ml.transforms.point_cloud.geometry.RandomRotateTargetAngle
          _convert_: all
          probability: 0.75
          # Multiples of pi
          yaw_angle_ratios: [0.5, 1.0, 1.5]
        - _target_: autoware_ml.transforms.point_cloud.geometry.GlobalRotScaleTrans
          _convert_: all
          yaw_rot_range: [-3.14159265, 3.14159265]
          scale_ratio_range: [0.9, 1.1]
          translation_std: [0.5, 0.5, 0.2]
        - _target_: autoware_ml.transforms.point_cloud.geometry.GlobalBEVRandomFlip
          _convert_: all
          horizontal_flip_ratio: 0.5
          vertical_flip_ratio: 0.5
        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomJitter
          _convert_: all
          sigma: 0.012
          clip: 0.05
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all
          points_range: ${point_cloud_range}
        - _target_: autoware_ml.transforms.point_cloud.sampling.RandomDropout
          _convert_: all
          probability: 0.5
          dropout_ratio: 0.2
        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomStrengthJitter
          _convert_: all
          gamma_range: [0.8, 1.25]
          scale_range: [0.9, 1.1]
          shift_range: [-0.02, 0.02]
  test_dataset:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          use_dim: [0, 1, 2, 3]
          bev_remove_radius: 0.0
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all
          past:
            _target_: autoware_ml.transforms.point_cloud.loading.SweepWindow
            num: 1
            time_lag_range: [0.05, 0.25]
            selection: nearest
          bev_remove_radius: 1.0
          use_timestamp_difference: true
          use_dim: [0, 1, 2, 3]
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all
          points_range: ${point_cloud_range}
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: true
  validation_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  test_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}

deploy:
  tensorrt:
    # Optimization profiles for every dynamic input of the two graphs (one mapping
    # for both modules; an entry that is not an input of the graph being built is
    # not applied to it).
    # Every dynamic dimension is a voxel count. min = 0.5x the smallest count seen,
    # opt = the midpoint, max = 1.5x the largest, since an engine must also accept
    # frames denser than any measured one. The counts below were measured over 30
    # j6gen2 test frames on the single-sweep grid-sampling pipeline (before the
    # multi-sweep voxelizer): re-measure them with the torch stage pipeline before
    # enabling TensorRT. Counts per encoder level (level 0 = the voxels, level i+1 =
    # after pooling i):
    #   level 0: 126052-135079   level 1: 60010-66581   level 2: 24389-28047
    #   level 3: 9337-11041      level 4: 3467-4226
    # point_feat_{i}, pooling_cluster_{i} and serialized_pooling_{i}_indices take
    # level i; the other serialized_pooling_{i}_* inputs take level i+1 (indptr is
    # that count + 1, CSR offsets); serialized_order/inverse are [2, N] for the two
    # serialization orders. Re-measure when the grid size, range or data change.
    input_shapes:
      voxels:
        min_shape: [63026, 32, 5]
        opt_shape: [130565, 32, 5]
        max_shape: [202619, 32, 5]
      num_points_per_voxel:
        min_shape: [63026]
        opt_shape: [130565]
        max_shape: [202619]
      grid_coord:
        min_shape: [63026, 3]
        opt_shape: [130565, 3]
        max_shape: [202619, 3]
      serialized_order:
