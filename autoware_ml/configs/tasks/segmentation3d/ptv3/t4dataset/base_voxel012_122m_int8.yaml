# @package _global_
# INT8 (attention / FFN linears) variant of the T4 PTv3 segmentation base.
# An experiment composes it in place of `base_voxel012_122m`, then runs `autoware-ml quantize`
# (writes the PTQ checkpoint) and `autoware-ml deploy` with that checkpoint as `--weights`.
#
# The checkpoint describes its own quantization, so deploy / test read nothing from the
# `quantization` section. Engines build strongly typed: the quantized Linear layers come
# from the Q/DQ (or FP8 trt-domain) nodes in the exported ONNX, quantized cpe sparse
# convolutions deploy as INT8 plugin nodes carrying their scales, everything else runs
# fp16, and the graph I/O stays fp32.
defaults:
  - base_voxel012_122m
  # The `quantization` section (off by default) lives with the quantized variants only.
  - /defaults/modules/quantization
  - _self_

# A run of its own next to the FP experiment's runs.
deploy:
  onnx:
    # fp16-typed QuantizeLinear / DequantizeLinear need opset 19.
    opset_version: 19
    precision: fp16
  tensorrt:
    enabled: true
  verification:
    enabled: true
    # Quantized raw softmax diffs between the fp32 fake-quant reference and the engine are
    # larger than the fp16 gate of base.yaml while mIoU stays equal. Measured 2026-09-24
    # (INT8 linears, SmoothQuant): pytorch vs tensorrt pred_probs max_diff 0.186
    # (mean 4.5e-4, 0.34 % of the labels flipped at near-ties); gate 0.5 (whole-list
    # override: Hydra lists replace).
    scenarios:
      - { ref: { backend: pytorch, device: cuda }, test: { backend: tensorrt, device: cuda }, tolerance: 0.5 }
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  default_precision: int8
  # Linears only: `cpe.0` is the one sparse convolution of every block's conditional
  # positional encoding, kept fp16 here (the `_int8_sparse` variant quantizes it too).
  skip_quantize:
    - "*cpe.0"
  # SmoothQuant migrates the activation outliers of the attention / FFN linears into
  # their weights before the per-tensor INT8 scales are taken.
  calibration:
    method: smoothquant
    smoothquant_alpha: 0.8
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
