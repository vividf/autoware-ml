# @package _global_
# INT8 (attention / FFN linears) variant of the T4 PTv3 segmentation base.
# An experiment composes it in place of `base_voxel012_122m`, then runs `autoware-ml quantize`
# (writes the PTQ checkpoint) and `autoware-ml deploy` with that checkpoint as `--weights`.
#
# The checkpoint describes its own quantization, so deploy / test read nothing from the
# `quantization` section. Engines build strongly typed: INT8 linears from the Q/DQ nodes,
# fp16 elsewhere and fp32 graph I/O.
defaults:
  - base_voxel012_122m
  - /defaults/modules/quantization
  - _self_

deploy:
  onnx:
    # fp16-typed QuantizeLinear / DequantizeLinear need opset 19.
    opset_version: 19
    precision: fp16
  tensorrt:
    enabled: true
  verification:
    enabled: true
    # The fp32 fake-quant reference and the engine differ by more than base.yaml's fp16 gate
    # while mIoU stays equal. pytorch vs tensorrt pred_probs max_diff on the v0.1.1 10 Hz
    # checkpoint (2026-10-26, one PTQ checkpoint, same frame): 0.35-0.52 over five engine
    # builds as TensorRT's tactics vary, 0.49-0.50 with INT8 cpe convolutions (mean 7e-4,
    # 0.4 % of labels flipped); 0.186 on another checkpoint (2026-09-24, mean 4.5e-4, 0.34 %
    # flipped at near-ties). The gate is the largest value x1.25. Hydra replaces the whole list.
    scenarios:
      - { ref: { backend: pytorch, device: cuda }, test: { backend: tensorrt, device: cuda }, tolerance: 0.65 }
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  default_precision: int8
  # `cpe.0` is the sparse convolution of each block's conditional positional encoding;
  # `_int8_sparse` quantizes it too.
  skip_quantize:
    - "*cpe.0"
  # SmoothQuant migrates the activation outliers of the attention / FFN linears into
  # their weights before the per-tensor INT8 scales are taken.
  calibration:
    method: smoothquant
    smoothquant_alpha: 0.8
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
