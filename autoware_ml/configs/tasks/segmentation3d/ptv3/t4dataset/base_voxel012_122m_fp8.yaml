# @package _global_
# FP8 (E4M3, per-tensor) variant of the T4 PTv3 segmentation base.
# An experiment composes it in place of `base_voxel012_122m`, then runs `autoware-ml quantize`
# (writes the PTQ checkpoint) and `autoware-ml deploy` with that checkpoint as `--weights`.
#
# The checkpoint describes its own quantization, so deploy / test read nothing from the
# `quantization` section. Engines build strongly typed: FP8 linears from the trt-domain
# Q/DQ nodes, fp16 elsewhere and fp32 graph I/O.
defaults:
  - base_voxel012_122m
  - /defaults/modules/quantization
  - _self_

deploy:
  onnx:
    # fp16-typed QuantizeLinear / DequantizeLinear need opset 19.
    opset_version: 19
    precision: fp16
  tensorrt:
    enabled: true
  verification:
    enabled: true
    # The `_int8` variant's gate, measured there; the FP8 engine's own max_diff is not
    # recorded yet. Hydra replaces the whole list.
    scenarios:
      - { ref: { backend: pytorch, device: cuda }, test: { backend: tensorrt, device: cuda }, tolerance: 0.65 }
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  # FP8 for the attention / FFN linears (E4M3 holds the mIoU that INT8 linears lose);
  # the cpe sparse convolutions stay fp16 (the plugin has no FP8 path).
  default_precision: fp8
  skip_quantize:
    - "*cpe.0"
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
