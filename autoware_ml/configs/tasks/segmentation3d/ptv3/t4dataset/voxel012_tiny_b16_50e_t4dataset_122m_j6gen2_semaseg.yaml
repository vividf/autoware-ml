# @package _global_
defaults:
  - base_voxel012_122m
  - /database@database: t4dataset/t4dataset_j6gen2_semaseg
  - _self_

batch_size: 16
num_workers: 8
experiment_group_name: ptv3_seg3d/${database.version}/j6gen2_semaseg
experiment_name: voxel012_tiny_b16_50e_t4dataset_122m

trainer:
  max_epochs: 50

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 50-epoch schedule.
    epoch_intervals: [[0, 5], [40, 1]]

deploy:
  tensorrt:
    # One table for both engines, keyed by ONNX input name; each engine takes its own inputs.
    # Every dynamic dimension is a voxel count: min = 0.5x the smallest count seen, opt = the
    # middle of the measured range, max = 1.5x the largest, so denser frames still fit. The
    # counts come from 30 j6gen2 test frames of the single-sweep grid-sampling pipeline, before
    # the multi-sweep voxelizer: re-measure them before enabling TensorRT, and whenever the
    # grid size, range or data change. Level 0 is the voxels, level i+1 the output of pooling i:
    #   level 0: 126052-135079   level 1: 60010-66581   level 2: 24389-28047
    #   level 3: 9337-11041      level 4: 3467-4226
    # point_feat_{i}, pooling_cluster_{i} and serialized_pooling_{i}_indices take level i, the
    # other serialized_pooling_{i}_* inputs level i+1 (indptr: count + 1, CSR offsets).
    # serialized_inverse and patch_order are [2, N], one row per serialization order;
    # patch_order rounds N up to whole attention windows (enc_patch_size, 512 on every level).
    input_shapes:
      voxels:
        min_shape: [63026, 32, 5]
        opt_shape: [130565, 32, 5]
        max_shape: [202619, 32, 5]
      num_points_per_voxel:
        min_shape: [63026]
        opt_shape: [130565]
        max_shape: [202619]
      grid_coord:
        min_shape: [63026, 3]
        opt_shape: [130565, 3]
        max_shape: [202619, 3]
      patch_order:
        min_shape: [2, 63488]
        opt_shape: [2, 131072]
        max_shape: [2, 202752]
      serialized_inverse:
        min_shape: [2, 63026]
        opt_shape: [2, 130565]
        max_shape: [2, 202619]
      serialized_pooling_0_indices:
        min_shape: [63026]
        opt_shape: [130565]
        max_shape: [202619]
      serialized_pooling_0_indptr:
        min_shape: [30006]
        opt_shape: [63296]
        max_shape: [99873]
      serialized_pooling_0_head_indices:
