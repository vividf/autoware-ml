# @package _global_
defaults:
  - base_voxel012_122m
  - /database@database: t4dataset/t4dataset_j6gen2_semaseg
  - _self_

batch_size: 16
num_workers: 8
experiment_group_name: ptv3_seg3d/${database.version}/j6gen2_semaseg
experiment_name: voxel012_tiny_b16_50e_t4dataset_122m

trainer:
  max_epochs: 50

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 50-epoch schedule.
    epoch_intervals: [[0, 5], [40, 1]]

deploy:
  tensorrt:
    # 16 GiB: with the counts below, TensorRT 10 on this host asks 4.65 GB for the first pooled
    # level's attention and 9.3 GB for the second; the ECU node (ptv3.param.yaml) builds the same
    # graph with 8 GiB on its TensorRT, to be confirmed with the node's owners.
    workspace_size: 17179869184
    # One table for both engines, keyed by ONNX input name; each engine takes its own inputs.
    # The counts are the ECU node's (autoware_ptv3 ptv3.param.yaml encoder.voxels_num
    # [16000, 160000, 256000], pilot_auto_sensing_perception, 2026-10-29), so the engine
    # evaluated here is built on the profile the ECU engine is built on. A tensor sized by
    # level-L voxels (level 0 = the voxels, level L+1 = the output of pooling L) takes
    # [min if L == 0 else 1, opt >> L, max], the node's stageProfileCounts rule, applied to every
    # tensor: TensorRT needs one opt per named dynamic axis, and the heads share the pooling
    # tensors' axes with the encoder. The max is the voxel budget, except on level 4 whose pooled
    # grid holds only 128 x 128 x 5 cells. indptr is a CSR offset array (count + 1); patch_order
    # rounds a count up to whole attention windows (512 on every level).
    # Measured j6gen2 test frames (30, single sweep) lie inside: level 0 126052-135079,
    # level 1 60010-66581, level 2 24389-28047, level 3 9337-11041, level 4 3467-4226.
    input_shapes:
      voxels:
        min_shape: [16000, 32, 5]
        opt_shape: [160000, 32, 5]
        max_shape: [256000, 32, 5]
      num_points_per_voxel:
        min_shape: [16000]
        opt_shape: [160000]
        max_shape: [256000]
      grid_coord:
        min_shape: [16000, 3]
        opt_shape: [160000, 3]
        max_shape: [256000, 3]
      patch_order:
        min_shape: [2, 16384]
        opt_shape: [2, 160256]
        max_shape: [2, 256000]
      serialized_inverse:
        min_shape: [2, 16000]
        opt_shape: [2, 160000]
        max_shape: [2, 256000]
      serialized_pooling_0_indices:
        min_shape: [16000]
        opt_shape: [160000]
        max_shape: [256000]
      serialized_pooling_0_indptr:
        min_shape: [2]
        opt_shape: [80001]
        max_shape: [256001]
      serialized_pooling_0_head_indices:
        min_shape: [1]
        opt_shape: [80000]
        max_shape: [256000]
      serialized_pooling_0_grid_coord:
        min_shape: [1, 3]
        opt_shape: [80000, 3]
        max_shape: [256000, 3]
      serialized_pooling_0_patch_order:
        min_shape: [2, 512]
        opt_shape: [2, 80384]
        max_shape: [2, 256000]
      serialized_pooling_0_serialized_inverse:
        min_shape: [2, 1]
