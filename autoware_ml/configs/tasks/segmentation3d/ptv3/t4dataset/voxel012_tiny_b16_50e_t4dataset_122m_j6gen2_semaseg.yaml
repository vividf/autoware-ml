# @package _global_
defaults:
  - base_voxel012_122m
  - /database@database: t4dataset/t4dataset_j6gen2_semaseg
  - _self_

batch_size: 16
num_workers: 8
experiment_group_name: ptv3_seg3d/${database.version}/j6gen2_semaseg
experiment_name: voxel012_tiny_b16_50e_t4dataset_122m

trainer:
  max_epochs: 50

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 50-epoch schedule.
    epoch_intervals: [[0, 5], [40, 1]]

deploy:
  tensorrt:
    # Optimization profiles for every dynamic input of the two graphs (one mapping
    # for both modules; an entry that is not an input of the graph being built is
    # not applied to it).
    # Every dynamic dimension is a voxel count. min = 0.5x the smallest count seen,
    # opt = the midpoint, max = 1.5x the largest, since an engine must also accept
    # frames denser than any measured one. The counts below were measured over 30
    # j6gen2 test frames on the single-sweep grid-sampling pipeline (before the
    # multi-sweep voxelizer): re-measure them with the torch stage pipeline before
    # enabling TensorRT. Counts per encoder level (level 0 = the voxels, level i+1 =
    # after pooling i):
    #   level 0: 126052-135079   level 1: 60010-66581   level 2: 24389-28047
    #   level 3: 9337-11041      level 4: 3467-4226
    # point_feat_{i}, pooling_cluster_{i} and serialized_pooling_{i}_indices take
    # level i; the other serialized_pooling_{i}_* inputs take level i+1 (indptr is
    # that count + 1, CSR offsets); serialized_inverse is [2, N] for the two serialization
    # orders, and patch_order is [2, N] with N rounded up to whole attention windows
    # of its level (enc_patch_size, 512 on every level here). Re-measure when the grid
    # size, range or data change.
    input_shapes:
      voxels:
        min_shape: [63026, 32, 5]
        opt_shape: [130565, 32, 5]
        max_shape: [202619, 32, 5]
      num_points_per_voxel:
        min_shape: [63026]
        opt_shape: [130565]
        max_shape: [202619]
      grid_coord:
        min_shape: [63026, 3]
        opt_shape: [130565, 3]
        max_shape: [202619, 3]
      patch_order:
        min_shape: [2, 63488]
        opt_shape: [2, 131072]
        max_shape: [2, 202752]
      serialized_inverse:
        min_shape: [2, 63026]
        opt_shape: [2, 130565]
        max_shape: [2, 202619]
      serialized_pooling_0_indices:
        min_shape: [63026]
        opt_shape: [130565]
        max_shape: [202619]
      serialized_pooling_0_indptr:
        min_shape: [30006]
