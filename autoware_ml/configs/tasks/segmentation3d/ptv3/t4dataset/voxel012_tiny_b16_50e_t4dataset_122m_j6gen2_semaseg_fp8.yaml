# @package _global_
# FP8 (E4M3, per-tensor) variant of the j6gen2 PTv3 segmentation config.
#
#   autoware-ml quantize --config-name segmentation3d/ptv3/t4dataset/voxel012_tiny_b16_50e_t4dataset_122m_j6gen2_semaseg_fp8 --weights <FP best.ckpt>
#   autoware-ml deploy   --config-name segmentation3d/ptv3/t4dataset/voxel012_tiny_b16_50e_t4dataset_122m_j6gen2_semaseg_fp8 --weights <ptq.ckpt>
#
# The checkpoint describes its own quantization, so deploy / test read nothing from the
# `quantization` section. Engines build strongly typed: the quantized Linear layers come
# from the Q/DQ (or FP8 trt-domain) nodes in the exported ONNX, quantized cpe sparse
# convolutions deploy as INT8 plugin nodes carrying their scales, everything else runs
# fp16, and the graph I/O stays fp32.
defaults:
  - voxel012_tiny_b16_50e_t4dataset_122m_j6gen2_semaseg
  # The `quantization` section (off by default) lives with the quantized variants only.
  - /defaults/modules/quantization
  - _self_

# A run of its own next to the FP experiment's runs.
experiment_name: voxel012_tiny_b16_50e_t4dataset_122m_fp8

deploy:
  onnx:
    # fp16-typed QuantizeLinear / DequantizeLinear need opset 19.
    opset_version: 19
    precision: fp16
  tensorrt:
    enabled: true
  verification:
    enabled: true
    # Quantized raw softmax diffs between the fp32 fake-quant reference and the engine are
    # larger than the fp16 gate of base.yaml while mIoU stays equal. The gate is the INT8
    # variant's (measured there 2026-09-24: pred_probs max_diff 0.186, 0.34 % of the labels
    # flipped); the FP8 engine's own max_diff has not been recorded yet (whole-list
    # override: Hydra lists replace).
    scenarios:
      - { ref: { backend: pytorch, device: cuda }, test: { backend: tensorrt, device: cuda }, tolerance: 0.5 }
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  # FP8 for the attention / FFN linears (E4M3 holds the mIoU that INT8 linears lose);
  # the cpe sparse convolutions stay fp16 (the plugin has no FP8 path).
  default_precision: fp8
  skip_quantize:
    - "*cpe.0"
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
