# @package _global_
# INT8 linears + INT8 cpe sparse convolutions (ImplicitGemm plugin scales) variant.
#
#   autoware-ml quantize --config-name segmentation3d/ptv3/t4dataset/voxel012_tiny_b16_50e_t4dataset_122m_j6gen2_semaseg_int8_sparse --weights <FP best.ckpt>
#   autoware-ml deploy   --config-name segmentation3d/ptv3/t4dataset/voxel012_tiny_b16_50e_t4dataset_122m_j6gen2_semaseg_int8_sparse --weights <ptq.ckpt>
#
# Same recipe as `_int8` with the twelve cpe sparse convolutions quantized as well: they
# deploy as INT8 plugin nodes carrying their scales (not as Q/DQ). Their channel counts
# (64-512) are where INT8 GEMMs pay off; the plugin needs the INT8 build of
# libautoware_tensorrt_plugins (docker/tensorrt_plugins/README.md).
defaults:
  - voxel012_tiny_b16_50e_t4dataset_122m_j6gen2_semaseg_int8
  - _self_

# A run of its own next to the FP experiment's runs.
experiment_name: voxel012_tiny_b16_50e_t4dataset_122m_int8_sparse

quantization:
  skip_quantize: []
