# @package _global_
defaults:
  - /tasks/default_task
  - /tasks/segmentation3d/ptv3/encoder_base
  - /tasks/segmentation3d/ptv3/voxel_encoder
  - /tasks/segmentation3d/ptv3/seg3d_head_base
  - _self_

database: ???
point_cloud_range: ???
# Edge of the cubic voxels the encoder serializes, in meters.
grid_size: ???
max_voxels: ???

data_preprocessor:
  preprocessor_modules:
    - _target_: autoware_ml.preprocessing.detection3d.point_pillar_preprocessor.PointPillarPreprocessor
      voxel_size: ["${grid_size}", "${grid_size}", "${grid_size}"]
      point_cloud_range: ${point_cloud_range}
      max_num_points: 32
      max_voxels: ${max_voxels}
      eval_max_voxels: ${max_voxels}

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.002
  weight_decay: 0.005

trainer:
  max_epochs: ???
  # Initial value only, the dynamic_validation callback of the root rewrites it per epoch.
  check_val_every_n_epoch: 5
  gradient_clip_val: 10.0

callbacks:
  model_checkpoint:
    monitor: val/loss
    mode: min
  early_stopping:
    monitor: val/loss
    patience: 20
    mode: min

deploy:
  onnx:
    enabled: true
    opset_version: 17
    dynamo: false
    do_constant_folding: false
    modules:
      ptv3_encoder:
        metainfo:
          point_cloud_range: ${point_cloud_range}
          voxel_size: ["${grid_size}", "${grid_size}", "${grid_size}"]
          serialization_orders: [z, z-trans]
          pooling_strides: ${model.encoder.stride}
          enc_channels: ${model.encoder.enc_channels}
          patch_sizes: ${model.encoder.enc_patch_size}
      ptv3_seg3d_head:
        metainfo:
          dec_depths: ${model.seg3d_head.dec_depths}
          class_names: ${database.taxonomy.segmentation3d.class_names}
  tensorrt:
    enabled: false
  # Post-export checks over the stage graph (PTv3Segmentation3DModel.build_stages). Both
  # opt-in; the pytorch reference runs the export modules (shuffle_orders off), so the raw
  # outputs are comparable across backends.
  verification:
    enabled: false
    num_verify_batches: 1
    # Gate on pred_probs (softmax); pred_labels is an int argmax and is reported as a
    # mismatch ratio, not gated. Measured 2026-09-18 on the j6gen2 FP checkpoint with the
    # fp16 island cast: pytorch vs tensorrt max_diff 0.0217 (mean 4e-5, 0.03 % of the
    # labels flipped at near-ties), mIoU equal; gate 0.1 leaves ~4x headroom.
    scenarios:
      - { ref: { backend: pytorch, device: cuda }, test: { backend: tensorrt, device: cuda }, tolerance: 0.1 }
  evaluation:
    enabled: false
    num_samples: -1
    num_warmup: 2
    backends:
      pytorch: { enabled: true, device: cuda }
      # Plugin ops have no ONNX Runtime implementation: this column would be the PyTorch
      # numbers under another name (the framework stars it), so it stays off.
      onnx: { enabled: false, device: cuda }
      tensorrt: { enabled: true, device: cuda }

model:
  _target_: autoware_ml.models.segmentation3d.ptv3.PTv3Segmentation3DModel
  _convert_: all
  metrics: ${metrics}
  log_dict_configs:
    _target_: autoware_ml.models.module_base_model.LogDictConfigs
    _convert_: all
    # Epoch-level only: per-step logging would split every key into train/<key>_step and
    # train/<key>_epoch and, with sync_dist, all-reduce every loss key on every step.
    on_step: false
    on_epoch: true
    prog_bar: true
    sync_dist: true
  grid_size: ${grid_size}
  point_cloud_range: ${point_cloud_range}
  optimizer: ${optimizer}
  optimizer_group_overrides:
    block:
      lr: 0.0002
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: [0.002, 0.0002]
    pct_start: 0.04
    anneal_strategy: cos
    div_factor: 10.0
    final_div_factor: 100.0
  scheduler_config:
    interval: step
