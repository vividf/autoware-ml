# @package _global_
defaults:
  - /defaults/default_runtime
  - /tasks/segmentation3d/ptv3/encoder_base
  - /tasks/segmentation3d/ptv3/seg_head_base
  - _self_

dataset: ???

grid_size: ???
point_cloud_range: ???

datamodule:
  collation_map:
    coord: concat
    grid_coord: concat
    segment: concat
    inverse: index_concat
    origin_segment: concat
    origin_coord: concat
    feat: concat
    ego2global: list
    scene_token: list
    timestamp: list

model:
  _target_: autoware_ml.models.segmentation3d.ptv3.PTv3SegmentationModel
  metrics: ${dataset.segmentation3d.metrics}
  grid_size: ${grid_size}
  point_cloud_range: ${point_cloud_range}
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.002
    weight_decay: 0.005
  optimizer_group_overrides:
    block:
      lr: 0.0002
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: [0.002, 0.0002]
    pct_start: 0.04
    anneal_strategy: cos
    div_factor: 10.0
    final_div_factor: 100.0
  scheduler_config:
    interval: step

trainer:
  max_epochs: 50
  gradient_clip_val: 10.0

callbacks:
  model_checkpoint:
    monitor: val/loss
    mode: min
  early_stopping:
    monitor: val/loss
    patience: 20
    mode: min

deploy:
  onnx:
    enabled: true
    opset_version: 17
    dynamo: false
    do_constant_folding: false
    modules:
      ptv3_encoder:
        output_names: [point_feat_0, point_feat_1, point_feat_2, point_feat_3, point_feat_4]
        metainfo:
          point_cloud_range: ${point_cloud_range}
          voxel_size: ["${grid_size}", "${grid_size}", "${grid_size}"]
          serialization_orders: [z, z-trans]
          pooling_strides: ${model.encoder.stride}
          enc_channels: ${model.encoder.enc_channels}
      ptv3_seg3d_head:
        output_names: [pred_labels, pred_probs]
        metainfo:
          dec_depths: ${model.seg3d_head.dec_depths}
          class_names: ${dataset.segmentation3d.class_names}
  tensorrt:
    enabled: false
  # Post-export checks over the stage graph (PTv3SegmentationModel.build_stages). Both
  # opt-in; the pytorch reference runs the export modules (shuffle_orders off), so the raw
  # outputs are comparable across backends.
  verification:
    enabled: false
    num_verify_batches: 1
    # Gate on pred_probs (softmax); pred_labels is an int argmax and is reported as a
    # mismatch ratio, not gated. Measured 2026-09-18 on the j6gen2 FP checkpoint with the
    # fp16 island cast: pytorch vs tensorrt max_diff 0.0217 (mean 4e-5, 0.03 % of the
    # labels flipped at near-ties), mIoU equal; gate 0.1 leaves ~4x headroom.
    scenarios:
      - { ref: { backend: pytorch, device: cuda }, test: { backend: tensorrt, device: cuda }, tolerance: 0.1 }
  evaluation:
    enabled: false
    num_samples: -1
    num_warmup: 2
    backends:
      pytorch: { enabled: true, device: cuda }
      # Plugin ops have no ONNX Runtime implementation: this column would be the PyTorch
      # numbers under another name (the framework stars it), so it stays off.
      onnx: { enabled: false, device: cuda }
      tensorrt: { enabled: true, device: cuda }
