# @package _global_
# INT8 (dense graph, explicit Q/DQ) variant of the j6gen2 lidar-only BEVFusion config.
#
#   autoware-ml quantize --config-name detection3d/bevfusion/lidar_voxel0170_second_secfpn_120m_t4dataset_j6gen2_int8 --weights <FP best.ckpt>
#   autoware-ml deploy   --config-name detection3d/bevfusion/lidar_voxel0170_second_secfpn_120m_t4dataset_j6gen2_int8 --weights <ptq.ckpt>
#
# The checkpoint describes its own quantization, so deploy / test read nothing from the
# `quantization` section. Engines build strongly typed: dense INT8 comes from the Q/DQ
# nodes in the exported ONNX, the un-quantized dense layers run fp16, the sparse plugin
# nodes run fp16 unless calibrated (see the `_int8_sparse` variant), and the graph I/O
# stays fp32.
defaults:
  - /tasks/detection3d/bevfusion/lidar_voxel0170_second_secfpn_120m_t4dataset_j6gen2
  - _self_

deploy:
  onnx:
    # fp16-typed QuantizeLinear / DequantizeLinear need opset 19.
    opset_version: 19
    precision: fp16
  tensorrt:
    enabled: true
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  fuse_bn: true
  default_precision: int8
  # Dense towers only: the sparse encoder stays fp16 here (the `_int8_sparse` variant
  # quantizes its late stages), the decoder's attention projections are structurally out
  # of reach at calibration time (packed nn.MultiheadAttention weights), and the first
  # backbone / neck stages cost accuracy in INT8.
  skip_quantize:
    - pts_middle_encoder
    - bbox_head.decoder
    - pts_neck.blocks.0
    - pts_backbone.blocks.0
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
