# @package _global_
# INT8 (dense graph, explicit Q/DQ) variant of the j6gen2 lidar-only BEVFusion config.
#
#   autoware-ml quantize --config-name detection3d/bevfusion/t4dataset/bevfusion_lidar/lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m_j6gen2_base_int8 --weights <FP best.ckpt>
#   autoware-ml deploy   --config-name detection3d/bevfusion/t4dataset/bevfusion_lidar/lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m_j6gen2_base_int8 --weights <ptq.ckpt>
#
# The checkpoint describes its own quantization, so deploy / test read nothing from the
# `quantization` section. Engines build strongly typed: INT8 from the Q/DQ nodes, fp16
# elsewhere (the sparse plugin nodes too, see `_int8_sparse`) and fp32 graph I/O.
defaults:
  - lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m_j6gen2_base
  - /defaults/modules/quantization
  - _self_

experiment_name: lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m_int8

deploy:
  onnx:
    # fp16-typed QuantizeLinear / DequantizeLinear need opset 19.
    opset_version: 19
    precision: fp16
  tensorrt:
    enabled: true
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  default_precision: int8
  # The sparse encoder stays fp16 (`_int8_sparse` quantizes its late stages), calibration
  # cannot reach the decoder's packed nn.MultiheadAttention projections, and the first
  # backbone / neck blocks cost accuracy in INT8.
  skip_quantize:
    - lidar_network.pts_middle_encoder
    - bbox_head.decoder
    - lidar_network.pts_neck.blocks.0
    - lidar_network.pts_backbone.blocks.0
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
