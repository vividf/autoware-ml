# @package _global_
# INT8 (dense graph, explicit Q/DQ) variant of the T4 lidar-only BEVFusion base.
# An experiment composes it in place of `base_lidar_voxel0170_120m`, then runs `autoware-ml quantize`
# (writes the PTQ checkpoint) and `autoware-ml deploy` with that checkpoint as `--weights`.
#
# The checkpoint describes its own quantization, so deploy / test read nothing from the
# `quantization` section. Engines build strongly typed: dense INT8 comes from the Q/DQ
# nodes in the exported ONNX, the un-quantized dense layers run fp16, the sparse plugin
# nodes run fp16 unless calibrated (see the `_int8_sparse` variant), and the graph I/O
# stays fp32.
defaults:
  - base_lidar_voxel0170_120m
  # The `quantization` section (off by default) lives with the quantized variants only.
  - /defaults/modules/quantization
  - _self_

# A run of its own next to the FP experiment's runs.
deploy:
  onnx:
    # fp16-typed QuantizeLinear / DequantizeLinear need opset 19.
    opset_version: 19
    precision: fp16
  tensorrt:
    enabled: true
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  default_precision: int8
  # Dense towers only: the sparse encoder stays fp16 here (the `_int8_sparse` variant
  # quantizes its late stages), the decoder's attention projections are structurally out
  # of reach at calibration time (packed nn.MultiheadAttention weights), and the first
  # backbone / neck stages cost accuracy in INT8.
  skip_quantize:
    - lidar_network.pts_middle_encoder
    - bbox_head.decoder
    - lidar_network.pts_neck.blocks.0
    - lidar_network.pts_backbone.blocks.0
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
