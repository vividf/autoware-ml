# @package _global_
voxel_size: [0.17, 0.17, 0.2]
# 244.8 m / 0.17 m = 1440 voxels per BEV axis, reduced to 180 by the three stride-2 stages of the
# sparse encoder, so the head works on a 180x180 grid at out_size_factor 8.
out_size_factor: 8

model:
  bbox_head:
    # Export without the softmax max-subtraction so TensorRT fuses the decoder attention into
    # one MHA kernel (0.68 -> 0.25 ms on this graph). Export only; the deploy evaluation gates it.
    fuse_export_attention: true
  lidar_network:
    pts_middle_encoder:
      # (Y, X, Z) voxel grid and dense (Y, X, Z) output of the sparse encoder.
      sparse_shape: [1440, 1440, 41]
      dense_output_shapes: [180, 180, 2]

deploy:
  # On by default: it is the only gate of model.bbox_head.fuse_export_attention above, whose
  # fp16 attention overflows where TensorRT does not fuse it. 100 frames show that; the whole
  # split (num_samples: -1) is the release measurement.
  evaluation:
    enabled: true
    num_samples: 100
  tensorrt:
    # The max is the evaluation voxel budget (eval_max_voxels), the most the runtime hands
    # the engine. Point channels: x, y, z, intensity, time lag.
    input_shapes:
      voxels:
        min_shape: [1000, "${max_num_points}", 5]
        opt_shape: [80000, "${max_num_points}", 5]
        max_shape: ["${eval_max_voxels}", "${max_num_points}", 5]
      coors:
        min_shape: [1000, 3]
        opt_shape: [80000, 3]
        max_shape: ["${eval_max_voxels}", 3]
      num_points_per_voxel:
        min_shape: [1000]
        opt_shape: [80000]
        max_shape: ["${eval_max_voxels}"]
