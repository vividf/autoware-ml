# @package _global_
# INT8 dense + INT8 sparse tower (ImplicitGemm plugin scales) variant.
#
#   autoware-ml quantize --config-name detection3d/bevfusion/t4dataset/bevfusion_lidar/lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m_j6gen2_base_int8_sparse --weights <FP best.ckpt>
#   autoware-ml deploy   --config-name detection3d/bevfusion/t4dataset/bevfusion_lidar/lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m_j6gen2_base_int8_sparse --weights <ptq.ckpt>
defaults:
  - lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m_j6gen2_base_int8
  - _self_

experiment_name: lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m_int8_sparse

quantization:
  # The early, high-resolution sparse layers lose the most accuracy and run slower in INT8
  # (per-layer GEMM speedup 0.45-0.82x below stage 3, 1.4-1.55x in stage 4), so they stay
  # fp16 and stage 3.1 onwards is quantized.
  skip_quantize:
    - bbox_head.decoder
    - lidar_network.pts_neck.blocks.0
    - lidar_network.pts_backbone.blocks.0
    - lidar_network.pts_middle_encoder.conv_input
    - lidar_network.pts_middle_encoder.encoder_layers.encoder_layer1
    - lidar_network.pts_middle_encoder.encoder_layers.encoder_layer2
    - lidar_network.pts_middle_encoder.encoder_layers.encoder_layer3.0
