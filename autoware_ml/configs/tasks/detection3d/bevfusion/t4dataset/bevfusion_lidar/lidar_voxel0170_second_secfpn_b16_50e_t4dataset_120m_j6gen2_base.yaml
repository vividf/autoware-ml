# @package _global_
defaults:
  - ../base_120m
  - base_lidar_voxel0170_120m
  - /database@database: t4dataset/t4dataset_j6gen2_base
  - override /database/t4dataset/taxonomy@database.taxonomy: default_dynamic
  - _self_

batch_size: 16
num_workers: 16
experiment_group_name: bevfusion/${database.version}/j6gen2_base
experiment_name: lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m

trainer:
  max_epochs: 50

deploy:
  tensorrt:
    # The max is the evaluation voxel budget (eval_max_voxels), the most the runtime hands
    # the engine. Point channels: x, y, z, intensity, time lag.
    input_shapes:
      voxels:
        min_shape: [1000, "${max_num_points}", 5]
        opt_shape: [80000, "${max_num_points}", 5]
        max_shape: ["${eval_max_voxels}", "${max_num_points}", 5]
      coors:
        min_shape: [1000, 3]
        opt_shape: [80000, 3]
        max_shape: ["${eval_max_voxels}", 3]
      num_points_per_voxel:
        min_shape: [1000]
        opt_shape: [80000]
        max_shape: ["${eval_max_voxels}"]
  # On by default: it is the only gate of model.bbox_head.fuse_export_attention below, whose
  # fp16 attention overflows where TensorRT does not fuse it. 100 frames show that; the whole
  # split (num_samples: -1) is the release measurement.
  evaluation:
    enabled: true
    num_samples: 100

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 50-epoch schedule.
    epoch_intervals: [[0, 5], [40, 1]]

# Include weights for pre-training
weights: ???

# Load a lower learning rate when it loads from a pre-training weight
optimizer:
  lr: 1.0e-4

model:
  bbox_head:
    # Export without the softmax max-subtraction so TensorRT fuses the decoder attention into
    # one MHA kernel (0.68 -> 0.25 ms on this graph). Export only; the deploy evaluation gates it.
    fuse_export_attention: true
  scheduler:
    warmup_epochs: 5
    decay_epochs: 45
