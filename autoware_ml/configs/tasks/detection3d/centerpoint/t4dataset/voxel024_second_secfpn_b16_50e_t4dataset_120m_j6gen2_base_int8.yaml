# @package _global_
# INT8 (explicit Q/DQ) variant of the j6gen2 CenterPoint config.
#
#   autoware-ml quantize --config-name detection3d/centerpoint/t4dataset/voxel024_second_secfpn_b16_50e_t4dataset_120m_j6gen2_base_int8 \
#     --weights <FP best.ckpt>
#   autoware-ml deploy   --config-name detection3d/centerpoint/t4dataset/voxel024_second_secfpn_b16_50e_t4dataset_120m_j6gen2_base_int8 \
#     --weights <ptq.ckpt written by the quantize run>
#
# The checkpoint carries its quantization: deploy and test do not read the `quantization`
# section. TensorRT builds strongly typed: INT8 where the ONNX has Q/DQ nodes, fp16 elsewhere
# (deploy.onnx.precision), fp32 graph I/O.
defaults:
  - voxel024_second_secfpn_b16_50e_t4dataset_120m_j6gen2_base
  # Only the quantized variants include the `quantization` section.
  - /defaults/modules/quantization
  - _self_

experiment_name: voxel024_second_secfpn_b16_50e_t4dataset_120m_int8

deploy:
  onnx:
    # fp16-typed QuantizeLinear / DequantizeLinear need opset 19.
    opset_version: 19
    precision: fp16
  tensorrt:
    enabled: true
  verification:
    enabled: true
    # Fake-quant and INT8 kernels round differently: raw outputs differ while the metrics
    # agree. Gates are at least 1.25x the max_diff measured on j6gen2 (2026-09-18, 400-sample
    # MSE calibration, 100 frames): pytorch-vs-onnx 5.04 (fp32 fake-quant vs fp16-typed Q/DQ
    # ONNX, run unoptimized), onnx-vs-tensorrt 13.41. mAP pytorch / onnx / tensorrt 0.4486 /
    # 0.4494 / 0.4470 (fp16 export: 0.4465); TensorRT model_graphs 6.83 -> 4.51 ms.
    scenarios:
      - { ref: { backend: pytorch, device: cuda }, test: { backend: onnx, device: cuda }, tolerance: 8.0 }
      - { ref: { backend: onnx, device: cuda }, test: { backend: tensorrt, device: cuda }, tolerance: 18.0 }
  evaluation:
    enabled: true

quantization:
  enabled: true
  mode: ptq
  default_precision: int8
  # The PFN is too cheap for INT8 to save latency. Quantizing the first SECOND stage costs
  # accuracy: mAP 0.4450 vs 0.4576 with it skipped (100 frames).
  skip_quantize:
    - pts_voxel_encoder
    - pts_backbone.blocks.0
  ptq:
    calibrate_samples: 400
    batch_size: 1
    calib_seed: 0
    calib_shuffle: false
