# @package _global_
# Recipe-parity fine-tune of StreamPETR on j6gen2 with traffic_cone/barrier
# partial-ignore, mirroring the AWML config
# t4_base_vov_flash_480x640_bev_2_7_traffic_barrier_j6gen2_partialignore.py:
# 40 epochs, batch size 1, base LR 5.0e-5 auto-scaled by batch/8.
# Shared parity settings (pc_range, augmentation, 2D aux head, partial-ignore,
# scheduler, callbacks) live in _awml_parity.yaml.
#
# Start from a converted AWML checkpoint via
#   --weights <streampetr_2_7_epoch_20_converted.pth>
# (see autoware_ml/tools/convert_streampetr_checkpoint.py) and point the
# annotation files at the machine's original infos:
#   datamodule.train_ann_file=info2/t4dataset_j6gen2_base_infos_train.pkl ...
defaults:
  - /tasks/detection3d/streampetr/vov_480x640_t4dataset_j6gen2
  - /tasks/detection3d/streampetr/_reset_scheduler
  - /tasks/detection3d/streampetr/_awml_parity
  - _self_

batch_size: 1
num_workers: 16

model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    # AWML trains with auto_scale_lr(base_batch_size=8): effective LR =
    # 5.0e-5 * total_batch_size / 8. With batch_size=1 on a single GPU that is
    # 6.25e-6; scale this value by total_batch_size/8 for other setups.
    lr: 6.25e-6
    weight_decay: 0.01
  optimizer_group_overrides:
    img_backbone:
      # AWML applies lr_mult=0.1 to the image backbone.
      lr: 6.25e-7

trainer:
  max_epochs: 40
