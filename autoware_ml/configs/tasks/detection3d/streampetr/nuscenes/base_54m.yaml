# @package _global_
defaults:
  - ../base
  # The metric suites, their ranges and the datamodule belong to the evaluated database, so the
  # range base composes them. Loaded before _self_ so the overrides below win over the defaults.
  - /metrics/nuscenes/detection3d/default_detection3d_metrics
  - /metrics/nuscenes/detection3d@metrics: default_detection3d_metric_suites
  - /metrics/nuscenes/detection3d@metric_ranges: default_detection3d_50m_metric_ranges
  - /datamodule@datamodule: nuscenes/default_detection3d_datamodule
  - _self_

point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
post_center_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]
image_size: [320, 800]
camera_names: [CAM_FRONT, CAM_FRONT_RIGHT, CAM_FRONT_LEFT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]

# Largest GT distance of every class, from the detection taxonomy of the database.
eval_class_range: ${database.taxonomy.detection3d.eval_range}

# nuScenes boxes carry no attributes the pipelines filter on.
filter_attributes: []

datasets:
  train:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        # First, before the boxes reach any geometry: a non-finite velocity or a zero extent
        # would turn the losses NaN or infinite.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all

          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}

        # The reference nuScenes pipeline range-filters before the augmentation (unlike the T4
        # pipeline, which filters after projecting the 2D annotations).
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all

        # The reference nuScenes recipe: resize by 0.47-0.625 into 320x800 with a random flip.
        - _target_: autoware_ml.transforms.camera.resize.ResizeCropFlipRotImage
          _convert_: all

          target_size: ${image_size}
          resize_range: [0.47, 0.625]
          bottom_crop_ratio_range: [0.0, 0.0]
          random_horizontal_flip: true
          training: true

        # Camera-only global augmentation: the boxes and the camera poses move together and
        # the frame pose folds the augmentation, so the temporal memory sees one world.
        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalRotScaleTrans
          _convert_: all

          yaw_rot_range: [-0.3925, 0.3925]
          scale_ratio_range: [0.95, 1.05]

        # Projects the augmented boxes for the auxiliary 2D head, after every geometric
        # augmentation.
        - _target_: autoware_ml.transforms.camera.annotations2d.LoadAnnotations2DFromBoxes3D
          _convert_: all

  test:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all

        - _target_: autoware_ml.transforms.camera.resize.ResizeCropFlipRotImage
          _convert_: all

          target_size: ${image_size}
          resize_range: [0.47, 0.625]
          bottom_crop_ratio_range: [0.0, 0.0]
          training: false

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all

          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

# StreamPETR carries a temporal memory across batches, so every dataloader streams the frames
# of its scenes in time order: the sampler joins the scenes and cuts their frames into one lane
# per batch position of every rank, and a cut can fall inside a scene. Streaming evaluation runs
# one lane per rank: on one GPU every frame is scored; with several GPUs, or wider evaluation
# batches, the longer lanes lose their last frame, fewer frames than there are lanes. A
# prediction has to serve every frame, so it runs on one device with batch size 1.
datamodule:
  streaming: true
  train_dataloader:
    shuffle: false
  validation_dataloader:
    batch_size: 1
  test_dataloader:
    batch_size: 1
  predict_dataloader:
    batch_size: 1
