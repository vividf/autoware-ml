# @package _global_
# StreamPETR on T4/j6gen2 — the production fine-tune recipe (stage 3 of the
# native three-stage flow: nuScenes pretrain -> T4 base -> j6gen2).
#
# This file pins the recipe of the final accepted training run
# (4 GPUs x batch 16 = total batch 64, 35 epochs, AdamW lr 4.0e-4 with
# img_backbone lr_mult 0.1): pc_range +-51.2, full train-time augmentation,
# auxiliary 2D FocalHead, iteration warmup + epoch cosine LR, seed 0,
# mAP-based checkpoint selection. Its traffic_cone/barrier partial-ignore
# waits for a per-frame flag the database does not provide yet (see below).
# An equivalent verified recipe is 4 GPUs x batch 8 (total 32) with both LRs
# halved (2.0e-4 / 2.0e-5); throughput is IO-bound so the two are within
# ~6.5% of each other, with matching final quality.
#
# autoware-ml has no auto_scale_lr: the LRs and the GPU count are pinned here.
# For any other total batch size N rescale both LRs by N/64.
#
# The detector trains the seven classes of the deployed camera detector (the
# seven_class taxonomy). The ground truth comes from the database's taxonomy and
# box pipelines, which differ from the accepted run's info files in a few class
# assignments and box filters (docs/models/streampetr.md lists them).
#
# Initialize from the stage-2 T4-base checkpoint:
#   --weights mlruns/detection3d/streampetr/vov_480x640_t4dataset_base/<run_id>/artifacts/checkpoints/best.ckpt
defaults:
  - /tasks/detection3d/streampetr/base
  - /datasets/t4dataset/detection3d
  - /datasets/t4dataset/camera
  - /database@database: t4dataset/t4dataset_j6gen2_base
  - /datamodule@datamodule: t4dataset/default_multiview_detection3d_datamodule
  - /tasks/detection3d/streampetr/focal2d_head@model.img_roi_head
  - override /database/t4dataset/taxonomy@database.taxonomy: seven_class
  - _self_

batch_size: 16         # per-GPU; 4 GPUs -> total batch 64
# More workers oversubscribe a shared host's CPU and starve the GPUs; raise
# only together with per-worker thread pinning (cv2.setNumThreads(0),
# OMP_NUM_THREADS=1) and measure.
num_workers: 8

dataset: ${t4dataset}

point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
post_center_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]
image_size: [480, 640]

camera_names: ${dataset.camera.camera_order}

# Partial-ignore of the traffic cones and barriers of the scenes that do not
# annotate them needs the per-frame flag of the batch
# (gt_traffic_cone_barrier_bbox_status), which the database does not fill yet.
# Until it does, these classes train without it; then set
# [traffic_cone, barrier], the accepted recipe.
partial_ignore_classes: null

# The GT of the training and the evaluation pipelines is limited to the
# +-51.2 m pc_range SQUARE by BBoxesRangeFilter, and the taxonomy evaluates
# every class up to 121 m, a no-op inside the square. A radial cap at the
# pc_range would remove the square's corners from the GT while corner
# predictions stayed and became guaranteed FPs, a semantics AWML's T4MetricV2
# (bev buckets, radial on both GT and predictions) cannot reproduce. The
# headline 0-121m mAP is therefore directly comparable to T4MetricV2's
# bev_center_0.0-121.0 evaluator, the pairing validated by BEVFusion parity.

datamodule:
  # StreamPETR carries a temporal memory across batches, so every lane walks whole scenes.
  streaming: true
  train_dataset:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all
          filter_attributes: ${dataset.detection3d.filter_attributes}
        # Boxes recorded with fewer than two lidar points are no training targets, as the
        # evaluation drops them (min_num_points: 2) and the other T4 detectors train. They
        # leave before the projection, so the auxiliary 2D targets drop them too.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinRecordedPointsFilter
          _convert_: all
          min_points: 2
        # The reference recipe shuffles the camera order every training frame
        # (StreamPETRDataset shuffle_cameras=True); train-time only.
        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all
          shuffle_order: true
        # +-0.02 around the factor at which every camera covers 480x640, so the
        # cameras of every vehicle keep the same framing.
        - _target_: autoware_ml.transforms.camera.geometry.ImageAug3D
          _convert_: all
          final_dim: ${image_size}
          resize_lim: [-0.02, 0.02]
          resize_relative: true
          bot_pct_lim: [0.0, 0.0]
          rot_lim: [0.0, 0.0]
          rand_flip: true
          training: true
        - _target_: autoware_ml.transforms.camera.geometry.CameraGlobalRotScaleTrans
          _convert_: all
          yaw_rot_range: [-0.3925, 0.3925]
          scale_ratio_range: [0.95, 1.05]
        # 2D annotations are projected from the augmented 3D boxes BEFORE the
        # range filter (matching the reference): the auxiliary 2D head
        # supervises every visible object even outside the 3D detection range.
        - _target_: autoware_ml.transforms.camera.annotations2d.LoadAnnotations2DFromBoxes3D
          _convert_: all
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all
          point_cloud_range: ${point_cloud_range}
  test_dataset:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all
        - _target_: autoware_ml.transforms.camera.geometry.ImageAug3D
          _convert_: all
          final_dim: ${image_size}
          resize_lim: [-0.02, 0.02]
          resize_relative: true
          bot_pct_lim: [0.0, 0.0]
          rot_lim: [0.0, 0.0]
          rand_flip: false
          training: false
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all
          filter_attributes: ${dataset.detection3d.filter_attributes}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all
          point_cloud_range: ${point_cloud_range}
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: false
  # Streaming evaluation runs one lane per rank: on one GPU every frame is
  # scored, with several GPUs every rank is trimmed to the shortest one (a few
  # percent of the frames), and wider eval batches trim every lane as well.
  validation_dataloader:
    batch_size: 1
    num_workers: ${num_workers}
  test_dataloader:
    batch_size: 1
    num_workers: ${num_workers}

model:
  img_backbone:
    _target_: autoware_ml.models.common.backbones.vovnet.VoVNet99MultiScale
    input_ch: 3
    out_features: [stage4, stage5]
    frozen_stages: -1
    norm_eval: true
  # CPFPN is the reference StreamPETR neck; GeneralizedLSSFPN
  # (concat + BN + ReLU) is a different architecture.
  img_neck:
    _target_: autoware_ml.models.common.necks.cp_fpn.CPFPN
    in_channels: [768, 1024]
    out_channels: 256
  bbox_head:
    num_queries: 644
    class_names: ${dataset.detection3d.class_names}
    partial_ignore_classes: ${partial_ignore_classes}
  img_roi_head:
    partial_ignore_classes: ${partial_ignore_classes}
  optimizer:
    lr: 4.0e-4         # base 5.0e-5 scaled by total_batch/8 (64/8)
  optimizer_group_overrides:
    img_backbone:
      lr: 4.0e-5       # lr_mult 0.1

trainer:
  # Pin to 4 GPUs so total batch stays 64 and the hard-coded LRs above match.
  # Lightning would otherwise grab every visible GPU and change the batch size.
  devices: 4
  max_epochs: 35
  # Mirrors the reference val_interval; override to 1 for finer
  # best-checkpoint selection on the small (~3.6k frame) j6gen2 val split.
  check_val_every_n_epoch: 5
