# @package _global_
defaults:
  - /tasks/detection3d/streampetr/base
  - /datasets/nuscenes/detection3d
  - /datasets/nuscenes/camera
  - /database@database: nuscenes/nuscenes_base
  - /datamodule@datamodule: nuscenes/default_multiview_detection3d_datamodule
  - _self_

batch_size: 8
num_workers: 16

dataset: ${nuscenes}

point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
post_center_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]
image_size: [320, 800]

camera_names: ${dataset.camera.camera_order}

datamodule:
  # StreamPETR carries a temporal memory across batches, so every lane walks whole scenes.
  streaming: true
  train_dataset:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
        # The reference nuScenes pipeline range-filters before the augmentation.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all
          point_cloud_range: ${point_cloud_range}
        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all
        - _target_: autoware_ml.transforms.camera.geometry.ImageAug3D
          _convert_: all
          final_dim: ${image_size}
          resize_lim: [0.47, 0.625]
          bot_pct_lim: [0.0, 0.0]
          rot_lim: [0.0, 0.0]
          rand_flip: false
          training: true
  test_dataset:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all
        - _target_: autoware_ml.transforms.camera.geometry.ImageAug3D
          _convert_: all
          final_dim: ${image_size}
          resize_lim: [0.47, 0.625]
          bot_pct_lim: [0.0, 0.0]
          rot_lim: [0.0, 0.0]
          rand_flip: false
          training: false
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all
          point_cloud_range: ${point_cloud_range}
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: false
  # Streaming evaluation runs one lane per rank: on one GPU every frame is
  # scored, with several GPUs every rank is trimmed to the shortest one (a few
  # percent of the frames), and wider eval batches trim every lane as well.
  validation_dataloader:
    batch_size: 1
    num_workers: ${num_workers}
  test_dataloader:
    batch_size: 1
    num_workers: ${num_workers}

model:
  img_backbone:
    _target_: autoware_ml.models.common.backbones.vovnet.VoVNet99MultiScale
    input_ch: 3
    out_features: [stage4, stage5]
    frozen_stages: -1
    norm_eval: true
  img_neck:
    _target_: autoware_ml.models.common.necks.lss_fpn.GeneralizedLSSFPN
    in_channels: [768, 1024]
    out_channels: 256
  bbox_head:
    num_queries: 644
