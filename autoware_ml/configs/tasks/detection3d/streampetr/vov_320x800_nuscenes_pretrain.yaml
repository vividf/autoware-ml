# @package _global_
# Stage 1 of the AWML three-stage StreamPETR recipe
# (nuScenes pretrain -> T4 base -> j6gen2 fine-tune), reproducing
#   projects/StreamPETR/configs/nuscenes/nuscenes_vov_flash_320x800_baseline.py
# i.e. total batch 16 (AWML: 4 GPUs x 4; here 2 GPUs x 8), 30 epochs,
# AdamW lr 4e-4 with img_backbone lr_mult 0.1, grad-clip 35, 500-iteration
# warmup into per-epoch cosine decay with eta_min = lr * 1e-3, resize
# 0.47-0.625 to 320x800 with random flip, global rot/scale augmentation.
#
# This differs from `vov_320x800_nuscenes` (the plain nuScenes reference
# config) in the two ways that matter for the three-stage flow:
#   * CPFPN neck instead of GeneralizedLSSFPN, and an auxiliary FocalHead2D,
#     so the produced checkpoint is weight-compatible with the T4 stages.
#   * The AWML pretrain augmentation and optimizer settings above.
# The nuScenes and T4 detector class sets are both the same 7 classes, so the
# checkpoint loads into stage 2 without dropping any classification layer.
#
# Practical note: AWML does not normally re-run this stage - the T4 configs
# start from the published model-zoo artifact
# `nuscenes_vov99_baseline_320x800.pth`. Running it here additionally needs
#   * the nuScenes dataset mounted (the default data_root is
#     ${AUTOWARE_ML_DATA_PATH}/nuscenes), and
#   * the DD3D/FCOS3D-pretrained VoVNet-99 backbone that AWML uses as
#     `load_from` (`fcos3d_vovnet_imgbackbone-remapped.pth`); without it the
#     backbone starts from random init and the recipe will underperform.
defaults:
  - /tasks/detection3d/streampetr/vov_320x800_nuscenes
  - _self_

batch_size: 8          # per-GPU; 2 GPUs -> total batch 16, matching AWML
num_workers: 8

datamodule:
  # Produced by LoadAnnotations2DFromBoxes3D for the auxiliary 2D head;
  # val/test/predict pipelines never carry these keys.
  train_collation_map:
    gt_bboxes_2d: list
    gt_labels_2d: list
    centers_2d: list
  train_transforms:
    _target_: autoware_ml.transforms.base.TransformsCompose
    pipeline:
      - _target_: autoware_ml.transforms.boxes3d.loading.LoadAnnotations3D
        name_mapping: ${dataset.detection3d.name_mapping}
      - _target_: autoware_ml.transforms.camera.loading.LoadMultiViewImagesFromFiles
        # Keep pixels in [0,255]: img_norm_cfg mean/std are 0-255-scale ImageNet stats.
        normalize_to_unit: false
      # AWML's nuScenes pipeline range-filters before augmentation (unlike the
      # T4 pipeline, which filters after projecting the 2D annotations).
      - _target_: autoware_ml.transforms.boxes3d.filters.ObjectRangeFilter
        point_cloud_range: ${point_cloud_range}
      - _target_: autoware_ml.transforms.camera.resize.ResizeCropFlipRotImage
        data_aug_conf:
          resize_lim: [0.47, 0.625]
          final_dim: [320, 800]
          bot_pct_lim: [0.0, 0.0]
          rot_lim: [0.0, 0.0]
          rand_flip: true
        training: true
      - _target_: autoware_ml.transforms.camera.geometry.GlobalRotScaleTrans
        rot_range: [-0.3925, 0.3925]
        scale_ratio_range: [0.95, 1.05]
      - _target_: autoware_ml.transforms.camera.resize.PadMultiViewImage
        size_divisor: 32
      - _target_: autoware_ml.transforms.camera.normalize.NormalizeMultiviewImage
        mean: ${img_norm_cfg.mean}
        std: ${img_norm_cfg.std}
        to_rgb: ${img_norm_cfg.to_rgb}
      - _target_: autoware_ml.transforms.camera.annotations2d.LoadAnnotations2DFromBoxes3D

model:
  # CPFPN is the reference StreamPETR neck and is weight-compatible with the
  # T4 stages and with AWML checkpoints.
  img_neck:
    _target_: autoware_ml.models.common.necks.cp_fpn.CPFPN
    in_channels: [768, 1024]
    out_channels: 256
  img_roi_head:
    _target_: autoware_ml.models.detection3d.heads.focal2d.FocalHead2D
    num_classes: ${dataset.detection3d.num_classes}
    in_channels: 256
    embed_dims: 256
    stride: 16
    loss_cls_weight: 2.0
    loss_bbox_weight: 5.0
    loss_iou_weight: 2.0
    loss_centers2d_weight: 10.0
    loss_centerness_weight: 1.0
    class_names: ${dataset.detection3d.class_names}
    assigner:
      _target_: autoware_ml.models.detection3d.task_modules.assigners2d.HungarianAssigner2D
      cls_cost:
        _target_: autoware_ml.models.detection3d.task_modules.match_costs.ClassificationCost
        weight: 2.0
      reg_cost:
        _target_: autoware_ml.models.detection3d.task_modules.assigners2d.BBoxL1Cost2D
        weight: 5.0
        box_format: xywh
      iou_cost:
        _target_: autoware_ml.models.detection3d.task_modules.assigners2d.IoUCost2D
        weight: 2.0
        iou_mode: giou
      centers2d_cost:
        _target_: autoware_ml.models.detection3d.task_modules.assigners2d.Center2DL1Cost
        weight: 10.0
  optimizer:
    lr: 4.0e-4         # AWML: bs 8 -> 2e-4, bs 16 -> 4e-4
  optimizer_group_overrides:
    img_backbone:
      lr: 4.0e-5       # lr_mult 0.1
  scheduler:
    # AWML's nuScenes schedule anneals to lr * 1e-3, not the 1e-4 the T4
    # stages use.
    eta_min_factor: 1.0e-3

trainer:
  # Pin to 2 GPUs so total batch stays 16 and the hard-coded LRs above match.
  devices: 2
  max_epochs: 30
  # AWML's nuScenes recipe clips at 35 (the T4 stages clip at 1).
  gradient_clip_val: 35.0
  check_val_every_n_epoch: 5
