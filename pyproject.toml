[build-system]
requires = ["setuptools", "torch", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoware-ml"
version = "0.0.0"
description = "Autoware-ML - Machine learning framework for Autoware."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Amadeusz Szymko", email = "amadeusz.szymko.2@tier4.jp"}]
keywords = ["autoware", "machine-learning", "autonomous-vehicle", "self-driving", "sensors"]
dependencies = [
    "cuda-python==12.8.0",
    # No official cp311 wheel exists for flash-attn 2.8.3+cu12+torch2.9 at Dao-AILab/flash-attention.
    # TODO: switch to https://github.com/Dao-AILab/flash-attention/releases once a matching official wheel is available.
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3+cu128torch2.9-cp311-cp311-linux_x86_64.whl#sha256=d4c842693349ef3e8b3b1396056003ecb9d21e94493dd1ea9ad6a2b3c6ce5c73",
    "hydra-core==1.3.2",
    # TODO: Use official release after https://github.com/facebookresearch/hydra/pull/3046 is merged
    "hydra-optuna-sweeper @ git+https://github.com/dahlem/hydra.git@feature/upgrade-optuna-4.2.1#subdirectory=plugins/hydra_optuna_sweeper",
    "jaxtyping==0.3.11",
    "lightning==2.6.1",
    "matplotlib==3.10.8",
    "mlflow==3.10.1",
    "numpy==1.26.4",
    "nuscenes-devkit==1.2.0",
    "nvidia-ml-py==13.610.43",
    # Quantization (PTQ/QAT) backend. Required: the quantization plan is part of every
    # model's build path (build_quantization_plan), so all environments carry modelopt.
    # huggingface_hub/safetensors are transitive imports of modelopt 0.46.0 that its
    # wheel does not declare.
    "nvidia-modelopt==0.46.0",
    "huggingface_hub>=0.30,<2.0",
    "safetensors>=0.4,<1.0",
    "optuna==4.8.0",
    "onnx==1.21.0",
    "onnx_graphsurgeon==0.6.1",
    "onnxruntime-gpu==1.24.4",
    "onnxscript==0.6.2",
    # ModelOpt AutoCast (modelopt.onnx) hard-imports these at package import; they are
    # the [onnx] extra of nvidia-modelopt, pinned here explicitly (pixi never installs
    # extras of already-pinned packages).
    "onnxslim==0.1.96",
    "onnxconverter-common==1.16.0",
    "polygraphy==0.53.4",
    "ml_dtypes==0.5.4",
    "lief==1.0.0",
    "cppimport==26.4.17",
    "opencv-python-headless==4.11.0.86",
    "optuna-dashboard==0.20.0",
    "polars>=1.38.1,<2.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.12.5,<2.13.0",
    "rerun-sdk==0.23.1",
    "rich==14.1.0",
    "scipy==1.17.1",
    "spconv-cu120==2.3.6",
    "t4-devkit @ git+https://github.com/tier4/t4-devkit.git@v0.6.0",
    # TensorRT: pinned to 10.8 for now. The deployment target (Jetson AGX Thor,
    # JetPack 7.2.1) ships TensorRT 10.16.2, but 10.16.x cannot build this
    # project's INT8 Q/DQ graphs on sm_120 workstations (Myelin
    # tactics_tiled_layout assertion; see NVIDIA/TensorRT #4715), so local
    # verification/evaluation would be impossible. 10.8 also matches the AWML
    # reference numbers. TODO: move to the Thor JetPack line (10.16.x) once the
    # INT8 ONNX has been smoke-built with trtexec on Thor hardware (sm_110).
    # The 10.8 meta-wheel does not declare its bindings/libs as dependencies
    # (older TRT wheels fetched them from setup.py, which pixi/uv never run),
    # so pin all three explicitly — otherwise `import tensorrt` fails with
    # "No module named tensorrt_bindings".
    "tensorrt-cu12==10.8.0.43",
    "tensorrt-cu12-bindings==10.8.0.43",
    "tensorrt-cu12-libs==10.8.0.43",
    "torch==2.9.1+cu128",
    "torchvision==0.24.1+cu128",
    "transforms3d==0.4.2"
]

[project.optional-dependencies]
dev = [
    "autoware-ml[test]",
    "pre-commit",
    "zensical",
]
test = [
    "pytest==9.0.2",
]

[project.urls]
Homepage = "https://tier4.github.io/autoware-ml"
Source = "https://github.com/tier4/autoware-ml"

[project.scripts]
autoware-ml = "autoware_ml.cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoware_ml*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.66"

[tool.pixi.system-requirements]
libc = { family = "glibc", version = "2.31" }
cuda = "12.8"

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128", "https://pypi.nvidia.com"]
# Required because some packages are split across the PyTorch and NVIDIA indexes.
# For example, `cuda-python` appears on the PyTorch index without the pinned 12.8 build,
# so `first-index` would stop before considering the NVIDIA index.
index-strategy = "unsafe-best-match"

[tool.pixi.activation.env]
# cuBLAS is only deterministic with a fixed workspace size; the trainer's
# `deterministic` mode (torch.use_deterministic_algorithms) depends on it.
CUBLAS_WORKSPACE_CONFIG = ":4096:8"
# Polars sizes its global thread pool once, when the extension module is first
# imported, so this has to be in the environment before Python starts; setting
# it from Python is too late. Keep the pool single-threaded: the dataloader
# already parallelizes across worker processes, and a multi-threaded pool
# forked into those workers can deadlock. Mirrored in docker/Dockerfile.
POLARS_MAX_THREADS = "1"

[tool.pixi.dependencies]
# Pixi keeps a small conda-forge base for Python and installer tooling. The
# runtime stack comes from [project.dependencies] via PyPI.
git = "*"
pip = "*"
python = "3.11.*"
setuptools = "*"
wheel = "*"

[tool.pixi.tasks]
install-project = "python -m pip install --no-cache-dir --no-build-isolation --no-deps -e ."
install-bash-completion = "bash -lc 'mkdir -p \"${HOME}/.local/share/bash-completion/completions\" && autoware-ml --show-completion bash > \"${HOME}/.local/share/bash-completion/completions/autoware-ml\"'"
setup-project = { depends-on = ["install-project", "install-bash-completion"] }
test = "pytest autoware_ml/tests/ -v"

# Full contributor environment on top of the default runtime/use stack.
[tool.pixi.feature.dev.dependencies]
bear = "*"
compilers = "*"
# nvcc 12.8 rejects host gcc > 14; an unpinned solve pulls gcc 15 and the CUDA
# extension build fails. Keep in sync with the CUDA toolkit version.
gcc = "14.*"
gxx = "14.*"
ninja = "*"
pkg-config = "*"
tmux = "*"

[tool.pixi.feature.dev.pypi-dependencies]
pre-commit = "*"
pytest = "==9.0.2"
zensical = "*"

[tool.pixi.feature.dev.tasks]
docs = "zensical build --clean"

# Lightweight environment used by CI to build documentation only.
[tool.pixi.feature.docs.dependencies]
python = "3.11.*"

[tool.pixi.feature.docs.pypi-dependencies]
zensical = "*"

[tool.pixi.feature.docs.tasks]
docs = "zensical build --clean"

[tool.pixi.environments]
# Default env is the non-dev "use" environment.
default = { solve-group = "default" }
# Dev env extends the default stack with contributor and docs tooling.
dev = { features = ["dev"], solve-group = "default" }
# Docs env is intentionally isolated from the default CUDA/ML stack.
docs = { features = ["docs"], solve-group = "docs", no-default-feature = true }

[tool.ruff.lint]
# Ignore F722 error to fix the error for JaxTyping in string typing, which is not used in our codebase.
ignore = ["F722"]

[tool.pytest.ini_options]
# autoware_ml/scripts holds stage entrypoint scripts, not tests; experiment_test.py
# would otherwise match the *_test.py collection pattern and fail collection.
addopts = "--ignore=autoware_ml/scripts"
